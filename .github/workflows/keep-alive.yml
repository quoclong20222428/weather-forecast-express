name: Aiven PostgreSQL Keep Alive

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Ping Aiven PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"

          echo "Aiven PostgreSQL is reachable."
